title:
  original: Create a ComplexHeatmap with row annotation
  translation: ~
description:
  original: |
    Generates a heatmap using the \pkg{ComplexHeatmap} package with a single-color
    row annotation. Designed to stack several heatmaps (for example, one per cell
    type) with consistent formatting.
  translation: ~
arguments:
  mat:
    original: A numeric matrix representing the heatmap values (e.g., Z-scores).
    translation: ~
  color:
    original: |-
      A character string specifying the annotation color
      (e.g., \code{"black"}, \code{"gold1"}).
    translation: ~
  split:
    original: |-
      A factor, character vector or data frame used to split the
      columns of the heatmap. \code{NULL} for no split.
    translation: ~
  common_names:
    original: |-
      A character vector of row names, used to size the
      annotation. By default, the row names of \code{mat}.
    translation: ~
  use_raster_flag:
    original: |-
      Logical. If \code{TRUE}, rasterization is enabled for
      faster rendering of large matrices (requires the \pkg{magick} package and a
      working Cairo/X11 installation). Default \code{FALSE}.
    translation: ~
details:
  original: |
    Requires the Bioconductor package \pkg{ComplexHeatmap}, which is
    not installed with GeneExprLupusMx. If it is missing, the function offers to
    install it (in interactive sessions) or stops. You can install it with:
    \preformatted{pak::pak("ComplexHeatmap")}
  translation: ~
value:
  original: |
    A \code{Heatmap} object from \pkg{ComplexHeatmap}, ready to be
    combined or drawn.
  translation: ~
note:
  original: |
    Other packages (e.g., \pkg{RplotterPkg} and \pkg{wilson}) also have a
    function called \code{create_heatmap()}. If you load one of them together
    with GeneExprLupusMx, the one loaded last is used. To make sure you use
    this one, call it as \code{GeneExprLupusMx::create_heatmap()}.
  translation: ~
examples:
  original: |+
    if (requireNamespace("ComplexHeatmap", quietly = TRUE)) {
      # small simulated Z-score matrix: 50 genes x 20 samples
      # (with the lesson data: zscore_mat <- download_data("zscore_mat"))
      set.seed(1)
      mat <- t(scale(t(matrix(rnorm(50 * 20), nrow = 50))))
      ht <- create_heatmap(mat, color = "black", split = NULL)
      ComplexHeatmap::draw(ht)
    }

  translation: ~
